# ─────────────────────────── General ───────────────────────────
corner-radius = 5.0;

backend = "glx";
vsync = true;
use-damage = true; # repinta solo la región dañada
detect-rounded-corners = true; # detecta ventanas con esquinas "shaped"
detect-client-opacity = true; # lee _NET_WM_WINDOW_OPACITY del cliente
detect-transient = true; # agrupa diálogos con su padre (group_focused)

# ─────────────────────────── Blur ──────────────────────────────
blur: {
  method = "dual_kawase";
  strength = 2;
};

# ───────────────────────── Animaciones ─────────────────────────
animations = (
  { triggers = [ "open" ];
    preset = "appear";
    scale = 0.96;
    duration = 0.2; },
  { triggers = [ "close" ];
    preset = "disappear";
    scale = 0.96;
    duration = 0.2; },
  { triggers = [ "increase-opacity", "decrease-opacity" ];
    opacity = {
      duration = 0.2;
      curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
      start = "window-raw-opacity-before";
      end = "window-raw-opacity";
    }; },
);

# ───────────────────── Reglas por ventana ──────────────────────
rules: (
  # menús contextuales algo translúcidos
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    opacity = 0.8; },

  # atenúa al perder el foco
  { match = "(window_type = 'normal' || window_type = 'utility') "
            "&& !focused && !group_focused "
            "&& !wmwin && !override_redirect && !fullscreen "
            "&& name != 'rofi' "
            "&& !_GTK_FRAME_EXTENTS@ "
            "&& !_NET_WM_WINDOW_OPACITY && !_NET_WM_WINDOW_OPACITY@";
    opacity = 0.7; },

  # sin blur detrás de la barra
  { match = "class_g = 'i3bar' || window_type = 'dock' "
            "|| window_type = 'popup_menu' || window_type = 'dropdown_menu' "
            "|| _GTK_FRAME_EXTENTS@";
    blur-background = false; },

  { match = "fullscreen";
    corner-radius = 0; },
)
